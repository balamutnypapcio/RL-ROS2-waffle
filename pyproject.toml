[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tb3_nav"
version = "0.1.0"
description = "Navigation TurtleBot3 Waffle Pi with RL in MuJoCo + ROS 2"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3.6", "gymnasium>=1.0", "numpy", "stable-baselines3", "tensorboard"]

[tool.setuptools.packages.find]
include = ["tb3_nav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
